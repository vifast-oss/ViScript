# SPDX-License-Identifier: MIT OR Apache-2.0
# Windows CI cho ViScript — chạy đúng "đường chuẩn Windows" mà W4 đã đo trên psvn:
# `cargo test --workspace --no-fail-fast` (KHÔNG nextest) + `vis-dev check` (Git Bash)
# + host suite. Không đổi gate Linux (repo chưa có workflow Linux; W4 không thêm).
#
# Giới hạn có chủ ý: runner chỉ có target host `x86_64-pc-windows-msvc`; KHÔNG cài
# `wasm32-unknown-unknown`/`x86_64-unknown-linux-gnu`. Vì vậy `targets_wasm_vis_types`
# tự báo BLOCKED-ENV và skip — không phải bằng chứng xanh cho cross-target.
name: windows

on:
  push:
    branches: [main, "vs3/**"]
  pull_request:
    branches: [main, "vs3/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Windows MSVC (Git Bash)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Normalize LF + exec cho entrypoint (Windows checkout)
        shell: bash
        run: |
          set -euo pipefail
          # Windows runner có thể checkout CRLF (core.autocrlf=true). Ép lại LF từ index
          # trước khi build để `cargo fmt --check`/snapshot không lệch; sau đó chuẩn hoá
          # entrypoint Git Bash (`bin/vis-dev`, `bin/vis`) và cấp bit thực thi.
          git config core.autocrlf false
          git reset --hard HEAD
          find bin -type f -exec sed -i 's/\r$//' {} +
          find test -type f -name '*.sh' -exec sed -i 's/\r$//' {} +
          chmod +x bin/*

      - name: Rust 1.100.0 + clippy/rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Python 3.12 (vis-dev doc/readme examples)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain
        shell: bash
        run: |
          cargo --version
          rustc --version

      - name: cargo test --workspace --no-fail-fast
        shell: bash
        run: cargo test --workspace --no-fail-fast

      - name: vis-dev check (Git Bash)
        shell: bash
        run: |
          set -euo pipefail
          # `vis-dev` tìm `python3`; runner Windows có `python` từ setup-python nhưng không
          # chắc có `python3`. Tạo shim tạm trong PATH của riêng bước này (không đổi mã cổng).
          shim="$(mktemp -d)"
          printf '%s\n' '#!/usr/bin/env bash' 'exec python "$@"' > "$shim/python3"
          chmod +x "$shim/python3"
          export PATH="$shim:$PATH"
          python3 --version
          bin/vis-dev check

      - name: host suite (Windows)
        shell: bash
        run: bin/vis-host-suite
