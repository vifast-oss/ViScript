# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cổng bắt buộc
        run: ./vis-dev gate --fast
