# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "vis-host-linux"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.99.1"
description = "Host Linux cho ViScript: probe Landlock + cưỡng chế hệ tệp bằng kernel (ST-132)"

# Workspace riêng: **không** thuộc workspace OS gốc và **không** thuộc `viscript/` (R4).
[workspace]

# **ST-132 (VD-120)**: crate `landlock` được duyệt CÓ ĐIỀU KIỆN — chỉ trong crate này,
# chỉ trên Linux, giấy phép MIT OR Apache-2.0 (khớp D2-21). Log kiểm giấy phép:
# `agent/JOURNAL/st132-license.log`. Không thêm crate nào khác.
#
# **ST-173 (VD-175 §2)**: `landlock` là crate **Linux-only** (dùng `libc::prctl`,
# `SYS_landlock_*`, `O_PATH`), nên đặt trong bảng phụ thuộc theo **nền đích**. Trên macOS/
# Windows crate này **không** được kéo vào; `src/lib.rs` và `tests/landlock.rs` đã có
# `#![cfg(target_os = "linux")]` từ ST-132 nên `cargo test` trên nền khác không biên dịch
# thân suite. Đây là **giới hạn nền** (Landlock chỉ có trên Linux), không phải thiếu sót;
# xem `agent/HOST-BAO-DAM.md`.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
