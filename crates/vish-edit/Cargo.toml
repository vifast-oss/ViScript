[package]
name = "vish-edit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ViShell MVP phần A (ST-304): raw-mode, multiline, history, CST coloring"

[dependencies]
vis-syntax = { path = "../vis-syntax" }
# **ST-310b (VD-285)**: `vish-edit` dùng `vish-term` làm tầng Terminal/Render duy nhất
# (SGR + raw mode). Hai dep OS cũ (`rustix` Unix, `crossterm` Windows) chuyển sang `vish-term`;
# không còn bản sao render/term trong crate này.
vish-term = { path = "../vish-term" }
