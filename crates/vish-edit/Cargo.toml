[package]
name = "vish-edit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ViShell MVP phần A (ST-304): raw-mode, multiline, history, CST coloring"

[dependencies]
vis-syntax = { path = "../vis-syntax" }

# Unix/macOS: rustix termios (đã có trong workspace; bật feature `termios` ở root).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

# Windows: crossterm raw-mode (VD-283 đã duyệt có điều kiện; 0 unsafe trong mã ta).
[target.'cfg(windows)'.dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["windows"] }
