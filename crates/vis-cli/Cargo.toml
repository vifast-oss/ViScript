# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
rust-version.workspace = true
name = "vis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vis"
path = "src/main.rs"

# **VD-PO-Windows-portability** — test helper binary emulating POSIX tools `echo/cat/grep/printf/true/false/sleep/sh`
# **VD-258 đã rà**: KHÔNG đặt `required-features` cho bin này — `env!("CARGO_BIN_EXE_test-child")`
# là hợp đồng biên dịch của nhiều integration test (`extern`, `vis_test`, `sem`, `diag_cmp`, …);
# bỏ bin khỏi build test sẽ làm gãy chúng.
# **VD-259**: Cargo không có cách khai báo "bin chỉ dùng test" mà vẫn giữ `CARGO_BIN_EXE_*`;
# `cargo build --release` / `cargo install --path crates/vis-cli` vẫn build/cài test-child.
# Đường phát hành **bắt buộc** dùng `bin/vis-release` (chỉ `--bin` trong `release-bins`) hoặc
# tường minh `cargo build --release -p vis-cli --bin vis` / `cargo install --path crates/vis-cli --bin vis`.
# `test/release/run.sh` (chạy trong `vis-dev check`) canh metadata + staging: test-child không lọt.
[[bin]]
name = "test-child"
path = "src/bin/test_child.rs"

[package.metadata.vis]
release-bins = ["vis"]

# **VD-242 Q6 / ST-156**: SQLite là **feature tùy chọn**. Cấu hình mặc định (bản host đang kiểm
# chứng) vẫn bật `sqlite` để giữ nguyên hành vi lịch sử; cấu hình core dùng
# `--no-default-features` (xem `agent/TARGET-MATRIX-2026-11-20.md`). Không đụng default feature
# không liên quan (crate này trước đây không có `[features]` nào khác).
# **VS3-4a (VD-271, 2026-11-21)** — TLS client cho `http.get`/`http.head` (`https://`). A0
# pre-approve `rustls` + `webpki-roots`; bật **mặc định** trên Linux/Windows, **cfg wasm32** (không
# kéo dependency vào target wasm). Review license/transitive/unsafe:
# `agent/BAO-CAO-VS3-4A-2026-11-21.md`. **ST-310d**: hai crate này nay thuộc
# `vis-host-native`; `vis-cli` chỉ forward feature `tls`.
#
# **VS3-5b (VD-271)** — chữ ký Ed25519 cho registry HTTP. Dùng lại **`ring` 0.17.14** đã có trong
# cây (transitive của `rustls`; license Apache-2.0 AND ISC; có unsafe/C/asm nội bộ — đã review ở
# `agent/BAO-CAO-VS3-4A-2026-11-21.md`). Không thêm crate mới, không kéo `aws-lc-rs`. Feature
# `pkg-sig` bật mặc định trên nền không phải wasm32; tắt feature ⇒ lệnh cài có yêu cầu chữ ký báo
# lỗi rõ thay vì bỏ qua kiểm tra.
# **ST-310d (VD-285)** — `vis-cli` chỉ **feature-forwarding** sang crate chủ
# (`vis-host-native`, `vis-pkg`); không còn dep OS/TLS/SQLite trực tiếp. Dep chỉ phục vụ
# test tích hợp (`rusqlite`, `rustls`, `tokio`, `h2`, `mio`, `rustix`, `ring`, `http`,
# `bytes`) nằm ở `[dev-dependencies]` bên dưới cho tới khi `ST-310e` chuyển suite về đúng crate.
[features]
default = ["sqlite", "tls", "pkg-sig", "http2", "async-h2"]
sqlite = ["vis-host-native/sqlite"]
tls = ["vis-host-native/tls"]
pkg-sig = ["vis-pkg/pkg-sig"]
# **VS3-4b2 (VD-271)** — HTTP/2 qua TLS + ALPN. Bật mặc định qua `async-h2`; vẫn có thể
# `--no-default-features --features …` để build core không h2. `h2`/`tokio`/`http`/`bytes`
# do `vis-host-native` sở hữu; đã review license/unsafe ở
# `agent/BAO-CAO-VS3-4B2-H2-IMPLEMENT-2026-11-21.md`.
http2 = ["tls", "vis-host-native/http2"]
# **VS3-W2 (2026-11-21)** — HTTP/2 **reactor-native** cho đường async. **Default-on non-wasm**
# (Linux + Windows; wasm32 loại module/deps theo target). Dùng chung `H2Core` với sync
# (`net/h2_core.rs`), không đổi API sync, không thêm dependency (dùng lại `h2`/`http2`,
# rustls và mio đã có). Fallback HTTP/1.1 khi ALPN không chọn h2 giữ nguyên.
async-h2 = ["http2", "tls", "vis-host-native/async-h2"]

# **ST-296a (VD-282)** — binary test gộp theo miền + `required-features` giữ nguyên.
# **ST-310e**: các suite đã chuyển về crate chủ (`vis-host-native`, `vis-pkg`, `vis-lsp`,
# `vis-loader`, `vis-plugin-abi`); `vis-cli/tests/` còn 8 binary, cổng `bin/vis-dev` chặn > 15.

[dependencies]
vis-http = { path = "../vis-http" }
vis-hir = { path = "../vis-hir" }
vis-diag = { path = "../vis-diag" }
vis-syntax = { path = "../vis-syntax" }
vis-fmt = { path = "../vis-fmt" }
vis-types = { path = "../vis-types" }
vis-core = { path = "../vis-core" }
vis-interp = { path = "../vis-interp", features = ["taskid-proto"] }
vis-bytecode = { path = "../vis-bytecode" }
vis-vm = { path = "../vis-vm" }
# **ST-296b (VD-281/VD-282)**: nạp đa tệp/lock metadata + LSP tách crate riêng.
vis-loader = { path = "../vis-loader" }
vis-lsp = { path = "../vis-lsp" }
vis-host-native = { path = "../vis-host-native" }
vis-pkg = { path = "../vis-pkg" }
# **ST-307/ST-310c (VD-278/VD-283/VD-285)**: `vis plugin` nạp plugin động WASI/WASM qua
# `VIS_PLUGIN_ABI_V1`; guest ABI mỏng ở `vis-plugin-abi`, host loader/chuyển đổi ở
# `vis-plugin-host` (0 `unsafe`, không thêm dependency ngoài workspace).
vis-plugin-host = { path = "../vis-plugin-host" }
# **ST-310b (VD-285)**: `vis repl` dùng `vish-edit` (TTY thật) + `vish-term` (Terminal/Render duy nhất).
vish-edit = { path = "../vish-edit" }
vish-term = { path = "../vish-term" }
# **ST-310d (VD-285)** — SQLite/TLS/HTTP2 do `vis-host-native` sở hữu; feature `sqlite`/`tls`/
# `http2`/`async-h2`/`pkg-sig` chỉ forward. Chi tiết license/unsafe của rusqlite/rustls/
# webpki-roots/h2/tokio giữ ở `crates/vis-host-native/Cargo.toml` và
# `agent/BAO-CAO-VS3-4A-2026-11-21.md` / `agent/BAO-CAO-VS3-4B2-H2-IMPLEMENT-2026-11-21.md`.

# **ST-132 (VD-120)**: chỉ trên Linux, chỉ để cưỡng chế kernel (Landlock). Nền khác không kéo
# crate này vào (nó `#![cfg(target_os = "linux")]`), nên ma trận `cargo check --target` vẫn 18/18.
[target.'cfg(target_os = "linux")'.dependencies]
vis-host-linux = { path = "../../vis-host-linux" }

# **ST-311c (VD-286)** — sau khi chuyển `vs3_http_cancel.rs` sang `vis-host-native/tests/http2_it/`,
# 7 dep cũ (`rusqlite`, `ring`, `http`, `bytes`, `rustls`, `tokio`, `h2`) không còn bất kỳ
# caller nào trong `vis-cli` (kể cả test) và đã được gỡ sạch. Chỉ còn `mio` + `rustix` trên
# Unix phục vụ bộ test frame selector (`async_it/lat256_net.rs`).
[target.'cfg(unix)'.dev-dependencies]
mio = { workspace = true }
rustix = { workspace = true }
