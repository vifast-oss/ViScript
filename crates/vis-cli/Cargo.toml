# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
rust-version.workspace = true
name = "vis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vis"
path = "src/main.rs"

# **VD-PO-Windows-portability** — test helper binary emulating POSIX tools `echo/cat/grep/printf/true/false/sleep/sh`
[[bin]]
name = "test-child"
path = "src/bin/test_child.rs"

# **VD-242 Q6 / ST-156**: SQLite là **feature tùy chọn**. Cấu hình mặc định (bản host đang kiểm
# chứng) vẫn bật `sqlite` để giữ nguyên hành vi lịch sử; cấu hình core dùng
# `--no-default-features` (xem `agent/TARGET-MATRIX-2026-11-20.md`). Không đụng default feature
# không liên quan (crate này trước đây không có `[features]` nào khác).
[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

# E2e SQLite dùng trực tiếp `rusqlite::Connection` để tạo WAL thật — chỉ có nghĩa khi bật
# feature. Với `--no-default-features` target này bị bỏ qua (các integration test khác giữ
# nguyên chế độ tự phát hiện).
[[test]]
name = "sqlite"
path = "tests/sqlite.rs"
required-features = ["sqlite"]

[dependencies]
vis-diag = { path = "../vis-diag" }
vis-syntax = { path = "../vis-syntax" }
vis-fmt = { path = "../vis-fmt" }
vis-types = { path = "../vis-types" }
vis-interp = { path = "../vis-interp" }
vis-bytecode = { path = "../vis-bytecode" }
vis-vm = { path = "../vis-vm" }
# **VD-241 (Gate 1, 2026-11-19)** — `std.sqlite` MVP: **rusqlite bundled**, ghim version; không tự
# viết binding C. Kéo theo `libsqlite3-sys` (bundled SQLite 3.50.2, sqlite3.c public domain;
# rusqlite MIT) — cần C compiler/linker trên máy build (Linux: cc/gcc đã kiểm).
# `hooks` (bắt buộc cho VD-241 §7): `Connection::authorizer` — ranh giới thực thi chính sách SQL
# (cấm ATTACH/DETACH/VACUUM/load_extension/ghi PRAGMA user_version). Feature rỗng, không dep thêm.
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled", "hooks"], optional = true }

# **ST-132 (VD-120)**: chỉ trên Linux, chỉ để cưỡng chế kernel (Landlock). Nền khác không kéo
# crate này vào (nó `#![cfg(target_os = "linux")]`), nên ma trận `cargo check --target` vẫn 18/18.
[target.'cfg(target_os = "linux")'.dependencies]
vis-host-linux = { path = "../../vis-host-linux" }

# **ST-271 / VD-254 (Lát 3)** — readiness selector thật cho đường frame test (`net.read`/
# `net.accept`); cfg Linux-only, KHÔNG vào core crate (wasm32), KHÔNG có `log` (tắt qua
# `default-features = false`). Adapter nằm hoàn toàn ở test integration của đường frame
# test-only ⇒ khai dev-dependency để không lọt vào artifact `vis` phát hành.
# A0 duyệt ghim tuyệt đối `=1.2.5` (MIT); transitive trên Linux chỉ `libc` (đã có).
[target.'cfg(target_os = "linux")'.dev-dependencies]
mio = { version = "=1.2.5", default-features = false, features = ["os-poll", "net"] }
