# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
rust-version.workspace = true
name = "vis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vis"
path = "src/main.rs"

# **VD-PO-Windows-portability** — test helper binary emulating POSIX tools `echo/cat/grep/printf/true/false/sleep/sh`
# **VD-258 đã rà**: KHÔNG đặt `required-features` cho bin này — `env!("CARGO_BIN_EXE_test-child")`
# là hợp đồng biên dịch của nhiều integration test (`extern`, `vis_test`, `sem`, `diag_cmp`, …);
# bỏ bin khỏi build test sẽ làm gãy chúng.
# **VD-259**: Cargo không có cách khai báo "bin chỉ dùng test" mà vẫn giữ `CARGO_BIN_EXE_*`;
# `cargo build --release` / `cargo install --path crates/vis-cli` vẫn build/cài test-child.
# Đường phát hành **bắt buộc** dùng `bin/vis-release` (chỉ `--bin` trong `release-bins`) hoặc
# tường minh `cargo build --release -p vis-cli --bin vis` / `cargo install --path crates/vis-cli --bin vis`.
# `test/release/run.sh` (chạy trong `vis-dev check`) canh metadata + staging: test-child không lọt.
[[bin]]
name = "test-child"
path = "src/bin/test_child.rs"

[package.metadata.vis]
release-bins = ["vis"]

# **VD-242 Q6 / ST-156**: SQLite là **feature tùy chọn**. Cấu hình mặc định (bản host đang kiểm
# chứng) vẫn bật `sqlite` để giữ nguyên hành vi lịch sử; cấu hình core dùng
# `--no-default-features` (xem `agent/TARGET-MATRIX-2026-11-20.md`). Không đụng default feature
# không liên quan (crate này trước đây không có `[features]` nào khác).
# **VS3-4a (VD-271, 2026-11-21)** — TLS client cho `http.get`/`http.head` (`https://`). A0
# pre-approve `rustls` + `webpki-roots`; bật **mặc định** trên Linux/Windows, **cfg wasm32** (không
# kéo dependency vào target wasm). Review license/transitive/unsafe:
# `agent/BAO-CAO-VS3-4A-2026-11-21.md`. Không thêm crate nào khác ngoài hai crate này.
#
# **VS3-5b (VD-271)** — chữ ký Ed25519 cho registry HTTP. Dùng lại **`ring` 0.17.14** đã có trong
# cây (transitive của `rustls`; license Apache-2.0 AND ISC; có unsafe/C/asm nội bộ — đã review ở
# `agent/BAO-CAO-VS3-4A-2026-11-21.md`). Không thêm crate mới, không kéo `aws-lc-rs`. Feature
# `pkg-sig` bật mặc định trên nền không phải wasm32; tắt feature ⇒ lệnh cài có yêu cầu chữ ký báo
# lỗi rõ thay vì bỏ qua kiểm tra.
[features]
default = ["sqlite", "tls", "pkg-sig", "http2", "async-h2"]
sqlite = ["dep:rusqlite", "vis-host-native/sqlite"]
tls = ["dep:rustls", "dep:webpki-roots", "vis-host-native/tls", "vis-pkg/tls"]
pkg-sig = ["dep:ring", "vis-pkg/pkg-sig"]
# **VS3-4b2 (VD-271)** — HTTP/2 qua TLS + ALPN. Bật mặc định qua `async-h2`; vẫn có thể
# `--no-default-features --features …` để build core không h2. Kéo `h2` + tokio (chỉ IO traits,
# không runtime mặc định) + http/bytes; đã review license/unsafe ở
# `agent/BAO-CAO-VS3-4B2-H2-IMPLEMENT-2026-11-21.md`.
http2 = ["tls", "dep:h2", "dep:tokio", "dep:http", "dep:bytes", "vis-host-native/http2"]
# **VS3-W2 (2026-11-21)** — HTTP/2 **reactor-native** cho đường async. **Default-on non-wasm**
# (Linux + Windows; wasm32 loại module/deps theo target). Dùng chung `H2Core` với sync
# (`net/h2_core.rs`), không đổi API sync, không thêm dependency (dùng lại `h2`/`http2`,
# rustls và mio đã có). Fallback HTTP/1.1 khi ALPN không chọn h2 giữ nguyên.
async-h2 = ["http2", "tls", "vis-host-native/async-h2"]

# **ST-296a (VD-282)** — binary test gộp theo miền + `required-features` giữ nguyên.
# SQLite: `sqlite_it` gom 20 tệp ca gốc (gồm `sqlite`, `vd266_db`, `vd268_dbcache`,
# `vd270_db_batch` + các `vd270_sqlite_*`).
[[test]]
name = "sqlite_it"
path = "tests/sqlite_it.rs"
required-features = ["sqlite"]

# TLS: `vs3_tls` + `vs3_registry_https`.
[[test]]
name = "tls_it"
path = "tests/tls_it.rs"
required-features = ["tls"]

# HTTP/2 + ALPN.
[[test]]
name = "http2_it"
path = "tests/http2_it.rs"
required-features = ["http2"]

# Chữ ký Ed25519 (pkg-sig).
[[test]]
name = "sig_it"
path = "tests/sig_it.rs"
required-features = ["pkg-sig"]

[dependencies]
vis-diag = { path = "../vis-diag" }
vis-syntax = { path = "../vis-syntax" }
vis-fmt = { path = "../vis-fmt" }
vis-types = { path = "../vis-types" }
vis-interp = { path = "../vis-interp", features = ["taskid-proto"] }
vis-bytecode = { path = "../vis-bytecode" }
vis-vm = { path = "../vis-vm" }
# **ST-296b (VD-281/VD-282)**: nạp đa tệp/lock metadata + LSP tách crate riêng.
vis-loader = { path = "../vis-loader" }
vis-lsp = { path = "../vis-lsp" }
vis-host-native = { path = "../vis-host-native" }
vis-pkg = { path = "../vis-pkg" }
# **ST-307/ST-310c (VD-278/VD-283/VD-285)**: `vis plugin` nạp plugin động WASI/WASM qua
# `VIS_PLUGIN_ABI_V1`; guest ABI mỏng ở `vis-plugin-abi`, host loader/chuyển đổi ở
# `vis-plugin-host` (0 `unsafe`, không thêm dependency ngoài workspace).
vis-plugin-host = { path = "../vis-plugin-host" }
# **VD-241 (Gate 1, 2026-11-19)** — `std.sqlite` MVP: **rusqlite bundled**, ghim version; không tự
# viết binding C. Kéo theo `libsqlite3-sys` (bundled SQLite 3.50.2, sqlite3.c public domain;
# rusqlite MIT) — cần C compiler/linker trên máy build (Linux: cc/gcc đã kiểm).
# `hooks` (bắt buộc cho VD-241 §7): `Connection::authorizer` — ranh giới thực thi chính sách SQL
# (cấm ATTACH/DETACH/VACUUM/load_extension/ghi PRAGMA user_version). `limits` (VD-258):
# `Connection::set_limit(SQLITE_LIMIT_LENGTH, …)` chặn `zeroblob`/text lớn materialize trước cap.
# Feature rỗng, không dep thêm.
rusqlite = { workspace = true, optional = true }

# **ST-132 (VD-120)**: chỉ trên Linux, chỉ để cưỡng chế kernel (Landlock). Nền khác không kéo
# crate này vào (nó `#![cfg(target_os = "linux")]`), nên ma trận `cargo check --target` vẫn 18/18.
[target.'cfg(target_os = "linux")'.dependencies]
vis-host-linux = { path = "../../vis-host-linux" }

# **ST-295 (VD-276, phương án A)** — `openat`/`openat2` an toàn cho đường đọc+ghi Unix.
# Ghim **tuyệt đối**, feature tối giản `fs` (+`std` cho `OwnedFd`/`std::io`), chỉ trên Unix nên
# Windows/wasm không kéo crate này. Giấy phép: Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT
# (thoả allowlist qua nhánh Apache-2.0); log kiểm toàn cây: `agent/JOURNAL/st295-license.log`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

# **VS3-4a (VD-271)** — TLS client. Ghim tuyệt đối để build tái lập; `default-features = false`
# + `ring` để **không** kéo `aws-lc-rs`/NASM. `webpki-roots` là **dữ liệu** gốc Mozilla (không
# code unsafe, không transitive). Chỉ target không phải wasm32 ⇒ `cargo check --target
# wasm32-unknown-unknown` không thấy hai crate này; `net.rs` trả lỗi rõ khi gọi HTTPS ở wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# **VS3-4b2** — chỉ khi feature `http2`. `h2` ghim tuyệt đối; tokio chỉ để có `AsyncRead/AsyncWrite`
# (không bật `rt`/`net`); http/bytes là kiểu request/body của h2. WASM không thấy các crate này.
h2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# **VS3-5b**: xác minh Ed25519 cho chữ ký index registry. Cùng phiên bản/nguồn mà `rustls` đã kéo
# (không thêm crate vào lock); ghim tuyệt đối để build tái lập. `default-features = false` +
# `std` là đủ cho `signature::UnparsedPublicKey::verify`.
ring = { workspace = true, optional = true }

# **ST-271 / VD-254 (Lát 3)** — readiness selector thật cho đường frame test (`net.read`/
# `net.accept`); cfg Linux-only, KHÔNG vào core crate (wasm32), KHÔNG có `log` (tắt qua
# `default-features = false`). Adapter nằm hoàn toàn ở test integration của đường frame
# test-only ⇒ khai dev-dependency để không lọt vào artifact `vis` phát hành.
# A0 duyệt ghim tuyệt đối `=1.2.5` (MIT); transitive trên Linux chỉ `libc` (đã có).
# **VS3-1d/W1f** — adapter async net production (frame scheduler) dùng cùng mio đã được duyệt
# cho test côté Linux. Chỉ target Unix; Windows/wasm giữ đường cũ (không có backend).
[target.'cfg(any(unix, windows))'.dependencies]
mio = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
mio = { workspace = true }
