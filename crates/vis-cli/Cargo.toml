[package]
rust-version.workspace = true
name = "vis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vis"
path = "src/main.rs"

[dependencies]
vis-diag = { path = "../vis-diag" }
vis-syntax = { path = "../vis-syntax" }
vis-fmt = { path = "../vis-fmt" }
vis-types = { path = "../vis-types" }
vis-interp = { path = "../vis-interp" }
vis-bytecode = { path = "../vis-bytecode" }
vis-vm = { path = "../vis-vm" }
# **VD-241 (Gate 1, 2026-11-19)** — `std.sqlite` MVP: **rusqlite bundled**, ghim version; không tự
# viết binding C. Kéo theo `libsqlite3-sys` (bundled SQLite 3.50.2, sqlite3.c public domain;
# rusqlite MIT) — cần C compiler/linker trên máy build (Linux: cc/gcc đã kiểm).
# `hooks` (bắt buộc cho VD-241 §7): `Connection::authorizer` — ranh giới thực thi chính sách SQL
# (cấm ATTACH/DETACH/VACUUM/load_extension/ghi PRAGMA user_version). Feature rỗng, không dep thêm.
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled", "hooks"] }

# **ST-132 (VD-120)**: chỉ trên Linux, chỉ để cưỡng chế kernel (Landlock). Nền khác không kéo
# crate này vào (nó `#![cfg(target_os = "linux")]`), nên ma trận `cargo check --target` vẫn 18/18.
[target.'cfg(target_os = "linux")'.dependencies]
vis-host-linux = { path = "../../vis-host-linux" }
