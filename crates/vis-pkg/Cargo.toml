# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "vis-pkg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Gói ViScript: manifest, resolver, registry HTTP, lock/store, Ed25519 — ST-300b"

[features]
default = []
pkg-sig = ["dep:ring"]

# **ST-310e** — suite chữ ký + registry HTTPS chuyển từ `vis-cli/tests/` về crate chủ.
[[test]]
name = "sig_it"
path = "tests/sig_it.rs"
required-features = ["pkg-sig"]

[dependencies]
vis-http = { path = "../vis-http" }
vis-diag = { path = "../vis-diag" }
vis-loader = { path = "../vis-loader" }
vis-core = { path = "../vis-core" }
vis-bytecode = { path = "../vis-bytecode" }
ring = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Chỉ test `sig_it` (registry HTTPS) dùng rustls làm server; không vào artifact.
rustls = { workspace = true }
