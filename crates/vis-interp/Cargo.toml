# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
rust-version.workspace = true
name = "vis-interp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thông dịch cây trên HIR cho ViScript VS0 (ST-13)"

[features]
# **VS3-3b/W5 prototype** (default off): mirror `Value` với `Task(TaskId)` + chuyển đổi.
# Không đổi enum `Value`/ABI; bật ở test/CLI khi thử hook evaluator.
taskid-proto = ["vis-runtime/taskid-proto"]

[dependencies]
vis-runtime = { path = "../vis-runtime" }
vis-http = { path = "../vis-http" }
vis-hir = { path = "../vis-hir" }
vis-core = { path = "../vis-core" }
# **ST-310b (VD-285)**: `Render` hạ bảng/bản ghi qua `vish-term` (một tầng Terminal/Render duy nhất).
vish-term = { path = "../vish-term" }
vis-diag = { path = "../vis-diag" }
vis-syntax = { path = "../vis-syntax" }

[dev-dependencies]
# Chi test/doctest ha HIR tu nguon; crate san pham doc thang `vis-hir`.
vis-types = { path = "../vis-types" }
