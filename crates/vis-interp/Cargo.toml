# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
rust-version.workspace = true
name = "vis-interp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thông dịch cây trên HIR cho ViScript VS0 (ST-13)"

[features]
# **VS3-3b/W5 prototype** (default off): mirror `Value` với `Task(TaskId)` + chuyển đổi.
# Không đổi enum `Value`/ABI; bật ở test/CLI khi thử hook evaluator.
taskid-proto = []

[dependencies]
vis-core = { path = "../vis-core" }
# ST-41: NFC để đếm **số char** khi render bảng (license MIT OR Apache-2.0 + Unicode-3.0, đã allowlist ở ST-01).
unicode-normalization = { workspace = true }
vis-diag = { path = "../vis-diag" }
vis-syntax = { path = "../vis-syntax" }
vis-types = { path = "../vis-types" }
