# SPDX-License-Identifier: MIT OR Apache-2.0
# Workspace dòng ViScript (ST-01). Crate lõi theo thiết kế §14.2; hiện có `vis-diag` (sổ mã lỗi,
# ST-02b), `vis-syntax` (lexer + parser/CST, ST-04/ST-05), `vis-fmt` (ST-07), `vis-types`
# (HIR + giải tên, ST-11), `vis-cli` và `vish-term` (Terminal/ViTerm, ST-308).
[workspace]
resolver = "2"
# **ST-312b (VD-289)**: `vis-host-linux` đã vào workspace chính (1 `Cargo.lock`, 1 toolchain).
# `vis-host-wasm` vẫn là workspace riêng (target wasm32, giữ nguyên như bản gốc `ViFastOs`);
# phải `exclude` để cargo không báo "multiple workspace roots".
exclude = ["vis-host-wasm"]
members = [
    "crates/vis-core",
    "crates/vis-http",
    "crates/vis-diag",
    "crates/vis-syntax",
    "crates/vis-cli",
    "crates/vis-fmt",
    "crates/vis-types",
    "crates/vis-interp",
    "crates/vis-bytecode",
    "crates/vis-vm",
    "crates/vis-host-native",
    "crates/vis-pkg",
    "crates/vis-loader",
    "crates/vis-lsp",
    "crates/vish-edit",
    "crates/vis-plugin-abi",
    "crates/vis-plugin-host",
    "crates/vis-plugin-macros",
    "crates/vish-term",
    "vis-host-linux",
]

[workspace.package]
# **ST-289 / VD-272(3)**: phiên bản workspace là **một nguồn** cho mọi crate thành viên;
# mỗi mốc phát hành bump ở đây, crate dùng `version.workspace = true` (không chép số).
# **ST-310f (v0.5.5)**: bump 0.5.0 → 0.5.5 cho mốc refactor kiến trúc Pha B.
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.100.0"
repository = "https://github.com/vifast-oss/ViScript"

# **ST-296b (VD-281/VD-282)**: gom **mọi phiên bản phụ thuộc bên ngoài** của workspace về một
# nguồn. Ghim tuyệt đối (`=`) giữ nguyên như trước — chỉ chuyển chỗ khai, Cargo.lock không đổi.
# Crate thành viên dùng `{ workspace = true }` (+ `optional`/feature bổ sung nếu cần).
[workspace.dependencies]
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-ident = "1"
# SQLite bundled (VD-241/VD-258): hooks + limits bắt buộc cho chính sách SQL.
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled", "hooks", "limits"] }
# ST-295 (VD-276): openat/openat2 an toàn cho đường đọc+ghi Unix.
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std", "termios"] }
# **ST-312b (VD-289)**: `landlock` (Linux-only) vào một nguồn workspace; `vis-host-linux` dùng
# `{ workspace = true }` trong bảng phụ thuộc `cfg(target_os = "linux")`.
landlock = "=0.4.7"
# VS3-4a/4b2 (VD-271): TLS + HTTP/2, ring thay aws-lc-rs; chỉ target không phải wasm32.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.11"
h2 = { version = "=0.4.20", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["io-util"] }
http = "=1.5.0"
bytes = "=1.12.2"
# VS3-5b (VD-271): Ed25519 cho chữ ký registry.
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
# ST-271/VS3-1d: readiness selector + async net của đường frame.
mio = { version = "=1.2.5", default-features = false, features = ["os-poll", "net", "os-ext"] }

# **VD-261 (tối ưu)**: bản phát hành không cần symbol; giảm ~1 MiB (~14%) binary.
# Không bật LTO để giữ thời gian build release ổn định; chỉ strip.
[profile.release]
strip = "symbols"
