# SPDX-License-Identifier: MIT OR Apache-2.0
# Workspace dòng ViScript (ST-01). Crate lõi theo thiết kế §14.2; hiện có `vis-diag` (sổ mã lỗi,
# ST-02b), `vis-syntax` (lexer + parser/CST, ST-04/ST-05), `vis-fmt` (ST-07), `vis-types`
# (HIR + giải tên, ST-11) và `vis-cli`.
[workspace]
resolver = "2"
# **ST-171**: `vis-host-linux`/`vis-host-wasm` là workspace RIÊNG (giữ nguyên như bản gốc
# `ViFastOs`, nơi chúng nằm ngoài `viscript/`). Nay gốc repo là cây ViScript nên chúng nằm
# trong cây — phải `exclude` để cargo không báo "multiple workspace roots".
exclude = ["vis-host-linux", "vis-host-wasm"]
members = [
    "crates/vis-diag",
    "crates/vis-syntax",
    "crates/vis-cli",
    "crates/vis-fmt",
    "crates/vis-types",
    "crates/vis-interp",
    "crates/vis-bytecode",
    "crates/vis-vm",
]

[workspace.package]
# **ST-289 / VD-272(3)**: phiên bản workspace là **một nguồn** cho mọi crate thành viên;
# mỗi mốc phát hành bump ở đây, crate dùng `version.workspace = true` (không chép số).
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.100.0"
repository = "https://github.com/vifast-oss/ViScript"

# **VD-261 (tối ưu)**: bản phát hành không cần symbol; giảm ~1 MiB (~14%) binary.
# Không bật LTO để giữ thời gian build release ổn định; chỉ strip.
[profile.release]
strip = "symbols"
